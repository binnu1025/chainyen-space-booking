<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群雁空間 · 場地借用</title>
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --line:#DDE1E6;
    --ink:#15181C; --ink-2:#5A6472; --ink-3:#8C96A3;
    --accent:#1F4B73; --accent-weak:#EAF0F6;
    --ok:#1D6748; --ok-weak:#EAF3EE;
    --bad:#A32B25; --bad-weak:#FAEDEC;
    --warn:#7E5A00; --warn-weak:#FAF3E0;
    --bar:#1B222B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:15px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
    color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--bar); color:#fff; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
  }
  header .t{flex:1;min-width:0}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.03em}
  header .s{font-size:12px;color:#9AA5B1;margin-top:1px}
  header img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#333D4A}
  .tag{
    font-size:11px;padding:2px 8px;border-radius:99px;
    background:#3A4654;color:#D7DEE6;white-space:nowrap;
  }
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card + .card{margin-top:14px}
  .card h2{
    margin:0;padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink-2);
    border-bottom:1px solid var(--line);background:#FAFBFC;
  }
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #EEF0F3}
  .row:last-child{border-bottom:none}
  .row .k{width:118px;flex:none;font-size:13px;color:var(--ink-2)}
  .row .v{flex:1;min-width:0;font-weight:500}
  .pill{
    display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;
  }
  .pill.ok{background:var(--ok-weak);color:var(--ok)}
  .pill.bad{background:var(--bad-weak);color:var(--bad)}
  .pill.warn{background:var(--warn-weak);color:var(--warn)}
  .pill.wait{background:#EEF0F3;color:var(--ink-3)}
  .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px}
  .note{padding:12px 16px;font-size:13px;color:var(--ink-2)}
  .btns{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
  button{
    font:inherit;font-size:15px;padding:12px 14px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
  }
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  .err{
    margin:16px;padding:14px 16px;border-radius:10px;
    background:var(--bad-weak);color:var(--bad);border:1px solid #EBC9C5;font-size:14px;
  }
  details{padding:0 16px 14px}
  summary{cursor:pointer;font-size:12px;color:var(--ink-3);padding:6px 0}
  pre{
    margin:6px 0 0;padding:10px;border-radius:6px;background:#F6F7F9;
    font-size:11.5px;line-height:1.5;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  /* ---- 確認框（取代手機內建的 confirm） ---- */
  .sheet-mask{
    position:fixed;inset:0;background:rgba(21,24,28,.45);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;transition:opacity .2s;
  }
  .sheet-mask.show{opacity:1}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:16px 16px 0 0;padding:20px 20px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(24px);transition:transform .22s;
    box-shadow:0 -6px 24px rgba(0,0,0,.12);
  }
  .sheet-mask.show .sheet{transform:none}
  .sheet .grip{width:36px;height:4px;border-radius:2px;background:#D5DAE0;margin:-6px auto 14px}
  .sheet h3{margin:0 0 6px;font-size:17px;font-weight:600}
  .sheet .lead{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
  .sheet .target{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
    background:var(--accent-weak);color:var(--accent);font-weight:600;font-size:15px;margin-bottom:12px;
  }
  .sheet .target i{
    font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;
  }
  .sheet .plabel{font-size:12px;color:var(--ink-3);margin:2px 0 6px}
  .sheet .bubble{
    display:inline-block;max-width:100%;padding:9px 12px;border-radius:16px 16px 4px 16px;
    background:#E3F4D9;color:#1E2A1A;font-size:14px;line-height:1.5;word-break:break-word;
  }
  .sheet .pwrap{text-align:right;margin-bottom:18px}
  .sheet .acts{display:flex;gap:10px}
  .sheet .acts button{flex:1}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);opacity:0;
    background:#15181C;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;
    transition:.25s;max-width:88%;text-align:center;
  }
  .toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<header>
  <div class="t">
    <h1>群雁空間 · 場地借用</h1>
    <div class="s">連線測試版</div>
  </div>
  <span class="tag">測試中</span>
  <img id="avatar" alt="" hidden>
</header>

<main id="main">
  <div class="card">
    <h2>連線檢查 <span id="stage" style="font-weight:400;color:var(--ink-3)">・載入中</span></h2>
    <div class="row"><div class="k">LINE 登入</div><div class="v" id="vLogin"><span class="pill wait">檢查中</span></div></div>
    <div class="row"><div class="k">群組成員</div><div class="v" id="vMember"><span class="pill wait">檢查中</span></div></div>
    <div class="row"><div class="k">開啟位置</div><div class="v" id="vContext"><span class="pill wait">檢查中</span></div></div>
    <div class="row"><div class="k">自動發群組通知</div><div class="v" id="vSend"><span class="pill wait">檢查中</span></div></div>
  </div>

  <div class="card">
    <h2>通知測試</h2>
    <div class="note">按下後會以<b>你本人的身分</b>發一則測試訊息。建議在<b>測試群組</b>裡試，不要在正式群組。</div>
    <div class="btns">
      <button class="pri" id="bSend" disabled>自動發送（需從群組聊天室打開）</button>
      <button id="bShare" disabled>分享到群組（自己選要發到哪個群組）</button>
    </div>
    <details>
      <summary>技術細節（回報問題時用）</summary>
      <pre id="debug">—</pre>
    </details>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- LINE 官方 LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ------------------------------------------------------------
// 設定（都是公開資訊，不是密碼；密碼類的東西絕對不要放在這個檔案）
// ------------------------------------------------------------
var LIFF_ID = '2012766187-3DZDUsfS';
var API_URL = 'https://script.google.com/macros/s/AKfycbxphmopTn2lbEOIcYyldjN3JsQbifG8SaRszXqo_3KPhA9p3cbtIdemK5L1MbyvqWO1/exec';
var TEST_TEXT = '（測試）群雁空間場地借用系統連線成功';

var CONTEXT_LABEL = {
  group: '群組聊天室', room: '多人聊天室', utou: '一對一聊天室',
  square_chat: '社群聊天室', external: '外部瀏覽器', none: 'LINE 內（非聊天室）'
};

function $(id){ return document.getElementById(id); }
function pill(kind, text){ return '<span class="pill ' + kind + '">' + text + '</span>'; }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
var tt;
function toast(m){
  var t = $('toast'); t.textContent = m; t.className = 'toast show';
  clearTimeout(tt); tt = setTimeout(function(){ t.className = 'toast'; }, 3200);
}
function fail(msg){
  $('main').insertAdjacentHTML('afterbegin', '<div class="err">' + esc(msg) + '</div>');
  var d = document.querySelector('details');
  if (d) d.open = true;                                  // 出錯時自動展開，方便截圖回報
}

/** 呼叫 GAS 借用 API。用 text/plain 送 JSON，避免跨網域預檢請求 */
function api(action, extra){
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

var debugInfo = {};
function showDebug(){ $('debug').textContent = JSON.stringify(debugInfo, null, 2); }

/**
 * 頁面風格的確認框，回傳 Promise<boolean>。
 * opts: { title, lead, target, preview, ok }
 */
function confirmSheet(opts){
  return new Promise(function(resolve){
    var mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="grip"></div>' +
        '<h3>' + esc(opts.title) + '</h3>' +
        (opts.lead ? '<p class="lead">' + esc(opts.lead) + '</p>' : '') +
        (opts.target ? '<div class="target"><i>群</i><span>' + esc(opts.target) + '</span></div>' : '') +
        (opts.preview ? '<div class="plabel">訊息預覽</div><div class="pwrap"><span class="bubble">' +
                        esc(opts.preview) + '</span></div>' : '') +
        '<div class="acts"><button data-r="0">取消</button>' +
        '<button class="pri" data-r="1">' + esc(opts.ok || '確定') + '</button></div>' +
      '</div>';
    document.body.appendChild(mask);
    requestAnimationFrame(function(){ mask.classList.add('show'); });
    function close(v){
      mask.classList.remove('show');
      setTimeout(function(){ mask.remove(); }, 200);
      resolve(v);
    }
    mask.onclick = function(e){
      if (e.target === mask) return close(false);          // 點外面 = 取消
      var r = e.target.getAttribute && e.target.getAttribute('data-r');
      if (r !== null && r !== undefined) close(r === '1');
    };
  });
}

/** 寫清楚「自動發送」會發到哪裡；name 是後端查到的群組名稱，查不到就用聊天室類型描述 */
var sendWhere = '';
function setSendTarget(canSend, type, name){
  // LINE 不一定會把群組身分給網頁；查不到名字時，用「你點開連結的那個…」描述
  sendWhere = name ? '「' + name + '」' : '你點開連結的那個' + (CONTEXT_LABEL[type] || '聊天室');
  if (canSend) {
    $('vSend').innerHTML = pill('ok', '可以') + '<div class="sub">會發到' + esc(sendWhere) + '</div>';
    $('bSend').textContent = '發測試訊息到' + sendWhere;
  } else {
    $('vSend').innerHTML = pill('warn', '不行') +
      '<div class="sub">不是從群組聊天室打開，沒有可以自動發送的地方。改用下方「分享到群組」</div>';
    $('bSend').textContent = '自動發送（需從群組聊天室打開）';
  }
  $('bSend').disabled = !canSend;
}

// ---- 進度與卡住偵測：手機上曾經四項都停在「檢查中」卻沒有任何訊息 ----
var stageName = '載入中', finished = false, watchdog = null;
function stage(name){
  stageName = name;
  $('stage').textContent = '・' + name;
  (debugInfo.stages = debugInfo.stages || []).push(name + ' @' + ((Date.now() - T0) / 1000).toFixed(1) + 's');
  showDebug();
  clearTimeout(watchdog);
  watchdog = setTimeout(function(){
    if (finished) return;
    fail('卡在「' + stageName + '」超過 12 秒。請按下方「重新整理」，若還是不行，請展開「技術細節」截圖給管理員。');
    showRetry();
  }, 12000);
}
function done(){ finished = true; clearTimeout(watchdog); $('stage').textContent = '・完成'; }
function showRetry(){
  if ($('retry')) return;
  $('main').insertAdjacentHTML('afterbegin',
    '<div class="card" id="retry"><div class="btns">' +
    '<button class="pri" onclick="location.reload()">重新整理</button>' +
    '<button onclick="location.href=\'https://liff.line.me/' + LIFF_ID + '\'">改用 LINE 視窗開啟</button>' +
    '</div></div>');
}

var T0 = Date.now();
// 在初始化之前先記下環境，卡住時才看得出原因（只記有沒有參數，不記參數內容）
debugInfo.env = {
  lineInAppBrowser: /\bLine\//i.test(navigator.userAgent),
  hasLoginCode: /[?&]code=/.test(location.search),
  hasLiffState: /liff\.state/.test(location.search),
  path: location.pathname,
  ua: navigator.userAgent.replace(/\s+/g, ' ').slice(0, 160)
};
try {
  var tries = +(sessionStorage.getItem('loginTries') || 0);
  debugInfo.env.loginTries = tries;
} catch (e) {}

function start(){
  if (typeof liff === 'undefined') {
    fail('LINE 元件載入失敗，可能是網路不穩。請按重新整理。');
    showRetry(); return;
  }
  stage('初始化 LINE');
  liff.init({ liffId: LIFF_ID }).then(function(){
    debugInfo.env.isInClient = liff.isInClient();
    debugInfo.env.isLoggedIn = liff.isLoggedIn();
    if (!liff.isLoggedIn()) {                            // 外部／內建瀏覽器：先導去 LINE 登入
      var n = 0;
      try { n = +(sessionStorage.getItem('loginTries') || 0) + 1; sessionStorage.setItem('loginTries', n); } catch (e) {}
      if (n > 2) {                                       // 避免無限跳轉
        fail('登入後又回到未登入狀態（已重試 ' + (n - 1) + ' 次）。請展開「技術細節」截圖給管理員。');
        showRetry(); return;
      }
      stage('導向 LINE 登入');
      liff.login({ redirectUri: location.origin + location.pathname });
      return;
    }
    try { sessionStorage.removeItem('loginTries'); } catch (e) {}
    stage('已登入，讀取環境');

    var ctx = liff.getContext() || {};
    var type = ctx.type || 'none';
    Object.assign(debugInfo, {                           // 不能整個覆蓋，會把進度紀錄洗掉
      contextType: type, viewType: ctx.viewType || '',
      isInClient: liff.isInClient(), os: liff.getOS(),
      lineVersion: liff.getLineVersion(), liffVersion: liff.getVersion(),
      scopes: ctx.scope || []
    });
    showDebug();

    // 開啟位置 & 能否自動發訊息
    $('vContext').innerHTML = esc(CONTEXT_LABEL[type] || type) +
      '<div class="sub">' + esc(type) + '</div>';
    var canSend = liff.isInClient() && (type === 'group' || type === 'room' || type === 'utou');
    var chatGroupId = (type === 'group' && ctx.groupId) ? ctx.groupId : '';
    debugInfo.hasGroupId = !!chatGroupId;                 // 只記有沒有，不記 ID 本身
    setSendTarget(canSend, type, '');
    $('bShare').disabled = !liff.isApiAvailable('shareTargetPicker');

    if (!liff.getIDToken()) {
      $('vLogin').innerHTML = pill('bad', '失敗');
      $('vMember').innerHTML = pill('wait', '無法確認');
      fail('拿不到登入憑證。請確認 LIFF 設定有勾 openid。');
      done(); showRetry();
      return;
    }

    // 向後端確認身分與群組成員
    stage('向伺服器確認身分');
    api('whoami', { chatGroupId: chatGroupId }).then(function(res){
      debugInfo.api = res.ok ? { ok: true, isMember: res.me.isMember, groupName: res.me.groupName,
                                 chatName: res.chat && res.chat.name } : res;
      if (res.ok && res.chat && res.chat.name) setSendTarget(canSend, type, res.chat.name);
      showDebug();
      done();
      if (!res.ok) {
        $('vLogin').innerHTML = pill('bad', '失敗');
        $('vMember').innerHTML = pill('wait', '無法確認');
        fail(res.error || '後端回應錯誤');
        showRetry();
        return;
      }
      var me = res.me;
      $('vLogin').innerHTML = '你好，' + esc(me.name);
      if (me.picture) { $('avatar').src = me.picture; $('avatar').hidden = false; }
      $('vMember').innerHTML = me.isMember
        ? pill('ok', '是') + '<div class="sub">' + esc(me.groupName) + '</div>'
        : pill('bad', '否') + '<div class="sub">' + esc(me.groupName || '目前沒有啟用的群組') + '</div>';
    }).catch(function(e){
      $('vLogin').innerHTML = pill('bad', '連線失敗');
      $('vMember').innerHTML = pill('wait', '無法確認');
      debugInfo.apiError = String(e); showDebug();
      done();
      fail('連不到資料伺服器，請稍後再試。');
      showRetry();
    });
  }).catch(function(e){
    debugInfo.initError = String(e && e.message || e); showDebug();
    done();
    fail('LINE 初始化失敗：' + (e && e.message || e));
    showRetry();
  });
}

$('bSend').onclick = function(){
  confirmSheet({
    title: '發送測試訊息',
    lead: '會以你本人的身分發出這則訊息，群組裡的人都看得到。',
    target: sendWhere.replace(/^「|」$/g, ''),
    preview: TEST_TEXT,
    ok: '確定發送'
  }).then(function(yes){
    if (!yes) return;
    liff.sendMessages([{ type: 'text', text: TEST_TEXT }])
      .then(function(){ toast('已發送'); })
      .catch(function(e){
        debugInfo.sendError = String(e && e.message || e); showDebug();
        toast('發送失敗：' + (e && e.message || e));
      });
  });
};

$('bShare').onclick = function(){
  liff.shareTargetPicker([{ type: 'text', text: TEST_TEXT }])
    .then(function(res){ toast(res ? '已分享' : '已取消分享'); })
    .catch(function(e){
      debugInfo.shareError = String(e && e.message || e); showDebug();
      toast('分享失敗：' + (e && e.message || e));
    });
};

start();
</script>
</body>
</html>
