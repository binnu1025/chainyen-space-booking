<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>群雁空間 · 場地借用</title>
<style>
  :root{
    --bg:#F4F5F7; --surface:#FFFFFF; --line:#DDE1E6;
    --ink:#15181C; --ink-2:#5A6472; --ink-3:#8C96A3;
    --accent:#1F4B73; --accent-weak:#EAF0F6;
    --ok:#1D6748; --ok-weak:#EAF3EE;
    --bad:#A32B25; --bad-weak:#FAEDEC;
    --warn:#7E5A00; --warn-weak:#FAF3E0;
    --bar:#1B222B;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:15px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
    color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--bar); color:#fff; padding:14px 16px;
    display:flex; align-items:center; gap:12px;
  }
  header .t{flex:1;min-width:0}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.03em}
  header .s{font-size:12px;color:#9AA5B1;margin-top:1px}
  header img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#333D4A}
  .tag{
    font-size:11px;padding:2px 8px;border-radius:99px;
    background:#3A4654;color:#D7DEE6;white-space:nowrap;
  }
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card + .card{margin-top:14px}
  .card h2{
    margin:0;padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink-2);
    border-bottom:1px solid var(--line);background:#FAFBFC;
  }
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #EEF0F3}
  .row:last-child{border-bottom:none}
  .row .k{width:118px;flex:none;font-size:13px;color:var(--ink-2)}
  .row .v{flex:1;min-width:0;font-weight:500}
  .pill{
    display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;
  }
  .pill.ok{background:var(--ok-weak);color:var(--ok)}
  .pill.bad{background:var(--bad-weak);color:var(--bad)}
  .pill.warn{background:var(--warn-weak);color:var(--warn)}
  .pill.wait{background:#EEF0F3;color:var(--ink-3)}
  .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px}
  .note{padding:12px 16px;font-size:13px;color:var(--ink-2)}
  .btns{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
  button{
    font:inherit;font-size:15px;padding:12px 14px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
  }
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  .err{
    margin:16px;padding:14px 16px;border-radius:10px;
    background:var(--bad-weak);color:var(--bad);border:1px solid #EBC9C5;font-size:14px;
  }
  details{padding:0 16px 14px}
  summary{cursor:pointer;font-size:12px;color:var(--ink-3);padding:6px 0}
  pre{
    margin:6px 0 0;padding:10px;border-radius:6px;background:#F6F7F9;
    font-size:11.5px;line-height:1.5;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);opacity:0;
    background:#15181C;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;
    transition:.25s;max-width:88%;text-align:center;
  }
  .toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<header>
  <div class="t">
    <h1>群雁空間 · 場地借用</h1>
    <div class="s">連線測試版</div>
  </div>
  <span class="tag">測試中</span>
  <img id="avatar" alt="" hidden>
</header>

<main id="main">
  <div class="card">
    <h2>連線檢查</h2>
    <div class="row"><div class="k">LINE 登入</div><div class="v" id="vLogin"><span class="pill wait">檢查中</span></div></div>
    <div class="row"><div class="k">群組成員</div><div class="v" id="vMember"><span class="pill wait">檢查中</span></div></div>
    <div class="row"><div class="k">開啟位置</div><div class="v" id="vContext"><span class="pill wait">檢查中</span></div></div>
    <div class="row"><div class="k">自動發群組通知</div><div class="v" id="vSend"><span class="pill wait">檢查中</span></div></div>
  </div>

  <div class="card">
    <h2>通知測試</h2>
    <div class="note">按下後會以<b>你本人的身分</b>發一則測試訊息。建議在<b>測試群組</b>裡試，不要在正式群組。</div>
    <div class="btns">
      <button class="pri" id="bSend" disabled>自動發到目前聊天室</button>
      <button id="bShare" disabled>分享到群組（手動選群組）</button>
    </div>
    <details>
      <summary>技術細節（回報問題時用）</summary>
      <pre id="debug">—</pre>
    </details>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- LINE 官方 LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ------------------------------------------------------------
// 設定（都是公開資訊，不是密碼；密碼類的東西絕對不要放在這個檔案）
// ------------------------------------------------------------
var LIFF_ID = '2012766187-3DZDUsfS';
var API_URL = 'https://script.google.com/macros/s/AKfycbxphmopTn2lbEOIcYyldjN3JsQbifG8SaRszXqo_3KPhA9p3cbtIdemK5L1MbyvqWO1/exec';
var TEST_TEXT = '（測試）群雁空間場地借用系統連線成功';

var CONTEXT_LABEL = {
  group: '群組聊天室', room: '多人聊天室', utou: '一對一聊天室',
  square_chat: '社群聊天室', external: '外部瀏覽器', none: 'LINE 內（非聊天室）'
};

function $(id){ return document.getElementById(id); }
function pill(kind, text){ return '<span class="pill ' + kind + '">' + text + '</span>'; }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
var tt;
function toast(m){
  var t = $('toast'); t.textContent = m; t.className = 'toast show';
  clearTimeout(tt); tt = setTimeout(function(){ t.className = 'toast'; }, 3200);
}
function fail(msg){
  $('main').insertAdjacentHTML('afterbegin', '<div class="err">' + esc(msg) + '</div>');
}

/** 呼叫 GAS 借用 API。用 text/plain 送 JSON，避免跨網域預檢請求 */
function api(action, extra){
  var body = Object.assign({ action: action, idToken: liff.getIDToken() }, extra || {});
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); });
}

var debugInfo = {};
function showDebug(){ $('debug').textContent = JSON.stringify(debugInfo, null, 2); }

function start(){
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) { liff.login(); return; }    // 外部瀏覽器：先導去 LINE 登入

    var ctx = liff.getContext() || {};
    var type = ctx.type || 'none';
    debugInfo = {
      contextType: type, viewType: ctx.viewType || '',
      isInClient: liff.isInClient(), os: liff.getOS(),
      lineVersion: liff.getLineVersion(), liffVersion: liff.getVersion(),
      scopes: (liff.getContext() && liff.getContext().scope) || []
    };
    showDebug();

    // 開啟位置 & 能否自動發訊息
    $('vContext').innerHTML = esc(CONTEXT_LABEL[type] || type) +
      '<div class="sub">' + esc(type) + '</div>';
    var canSend = liff.isInClient() && (type === 'group' || type === 'room' || type === 'utou');
    $('vSend').innerHTML = canSend
      ? pill('ok', '可以') + '<div class="sub">借好後能自動發到這個聊天室</div>'
      : pill('warn', '不行') + '<div class="sub">改用「分享到群組」，多按一下</div>';
    $('bSend').disabled = !canSend;
    $('bShare').disabled = !liff.isApiAvailable('shareTargetPicker');

    if (!liff.getIDToken()) {
      $('vLogin').innerHTML = pill('bad', '失敗');
      $('vMember').innerHTML = pill('wait', '無法確認');
      fail('拿不到登入憑證。請確認 LIFF 設定有勾 openid。');
      return;
    }

    // 向後端確認身分與群組成員
    api('whoami').then(function(res){
      debugInfo.api = res.ok ? { ok: true, isMember: res.me.isMember, groupName: res.me.groupName } : res;
      showDebug();
      if (!res.ok) {
        $('vLogin').innerHTML = pill('bad', '失敗');
        $('vMember').innerHTML = pill('wait', '無法確認');
        fail(res.error || '後端回應錯誤');
        return;
      }
      var me = res.me;
      $('vLogin').innerHTML = '你好，' + esc(me.name);
      if (me.picture) { $('avatar').src = me.picture; $('avatar').hidden = false; }
      $('vMember').innerHTML = me.isMember
        ? pill('ok', '是') + '<div class="sub">' + esc(me.groupName) + '</div>'
        : pill('bad', '否') + '<div class="sub">' + esc(me.groupName || '目前沒有啟用的群組') + '</div>';
    }).catch(function(e){
      $('vLogin').innerHTML = pill('bad', '連線失敗');
      $('vMember').innerHTML = pill('wait', '無法確認');
      debugInfo.apiError = String(e); showDebug();
      fail('連不到資料伺服器，請稍後再試。');
    });
  }).catch(function(e){
    debugInfo.initError = String(e && e.message || e); showDebug();
    fail('LINE 初始化失敗：' + (e && e.message || e));
  });
}

$('bSend').onclick = function(){
  if (!confirm('會以你的身分，在目前聊天室發一則測試訊息。確定？')) return;
  liff.sendMessages([{ type: 'text', text: TEST_TEXT }])
    .then(function(){ toast('已發送到聊天室'); })
    .catch(function(e){
      debugInfo.sendError = String(e && e.message || e); showDebug();
      toast('發送失敗：' + (e && e.message || e));
    });
};

$('bShare').onclick = function(){
  liff.shareTargetPicker([{ type: 'text', text: TEST_TEXT }])
    .then(function(res){ toast(res ? '已分享' : '已取消分享'); })
    .catch(function(e){
      debugInfo.shareError = String(e && e.message || e); showDebug();
      toast('分享失敗：' + (e && e.message || e));
    });
};

start();
</script>
</body>
</html>
